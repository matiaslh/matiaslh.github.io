<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — command not found</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <style>
    main { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    .window { width: 100%; max-width: 640px; }
    .big { font-size: clamp(48px, 12vw, 96px); font-weight: 800; color: var(--bright); line-height: 1; margin: 8px 0 18px; }
  </style>
</head>
<body>
  <main>
    <div class="window">
      <div class="window__bar">
        <span class="window__dots"><i></i><i></i><i></i></span>
        <span class="window__title">visitor@matiaslh: ~</span>
      </div>
      <div class="window__body">
        <p class="cmd"><span class="prompt">~ $</span> cd <span data-path>this-page</span></p>
        <p class="big">404</p>
        <p class="c-red">zsh: no such file or directory</p>
        <p class="cmd" style="margin-top:18px"><span class="prompt">~ $</span> cd <a href="/">~</a><span class="cursor"></span></p>
      </div>
    </div>
  </main>
  <script>
    document.querySelector('[data-path]').textContent = decodeURIComponent(location.pathname);
  </script>
</body>
</html>
